
name: Build EnderPearlTP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle Setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Mod
        run: gradle clean build

      - name: Check Fabric Metadata
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -x 'fabric.mod.json'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EnderPearlTP
          path: build/libs/*.jar
